name: 안드로이드 APK 만들기

# 삼성폰 등 안드로이드 기기에 바로 설치할 수 있는 APK 를 만든다.
# 내 컴퓨터에 Android Studio 나 JDK 를 설치하지 않아도 되고, Play 스토어 계정도 필요 없다.
#
# 쓰는 법: Actions 탭 → "안드로이드 APK 만들기" → Run workflow →
#          끝나면 아래 Artifacts 에서 apk 를 내려받아 폰으로 옮겨 설치한다.
#
# (선택) Play 스토어에 올릴 서명본이 필요하면 아래 시크릿을 넣는다. 없으면 테스트용 APK 만 만들어진다.
#   ANDROID_KEYSTORE_BASE64   키스토어(.jks) 파일을 base64 로 인코딩한 값
#   ANDROID_KEYSTORE_PASSWORD 키스토어 비밀번호
#   ANDROID_KEY_ALIAS         키 별칭
#   ANDROID_KEY_PASSWORD      키 비밀번호

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 소스 받기
        uses: actions/checkout@v4

      - name: Node 준비
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Java 준비
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 안드로이드 SDK 준비
        uses: android-actions/setup-android@v3

      - name: 의존성 설치
        run: npm ci

      - name: 웹 빌드와 네이티브 동기화
        run: |
          npm run build
          npx cap sync android

      - name: 빌드 번호를 실행 번호로
        run: |
          sed -i "s/versionCode 1/versionCode ${GITHUB_RUN_NUMBER}/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: 키스토어 준비 (시크릿이 있을 때만)
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "서명 키스토어를 찾았습니다. 서명된 APK 와 AAB 도 만듭니다."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "키스토어 시크릿이 없어 테스트용(디버그) APK 만 만듭니다."
          fi

      - name: 테스트용 APK 빌드 (바로 설치 가능)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 서명된 APK · AAB 빌드 (Play 스토어용)
        if: steps.keystore.outputs.signed == 'true'
        working-directory: android
        env:
          MYVANITY_STORE_FILE: ${{ runner.temp }}/release.jks
          MYVANITY_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MYVANITY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MYVANITY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace \
            -PMYVANITY_STORE_FILE="$MYVANITY_STORE_FILE" \
            -PMYVANITY_STORE_PASSWORD="$MYVANITY_STORE_PASSWORD" \
            -PMYVANITY_KEY_ALIAS="$MYVANITY_KEY_ALIAS" \
            -PMYVANITY_KEY_PASSWORD="$MYVANITY_KEY_PASSWORD"

      - name: 결과 파일 목록
        run: find android/app/build/outputs -name "*.apk" -o -name "*.aab" | sort

      - name: APK 내려받기용으로 올리기
        uses: actions/upload-artifact@v4
        with:
          name: my-vanity-android
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
